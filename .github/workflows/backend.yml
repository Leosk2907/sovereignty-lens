name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'workstreams/backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'workstreams/backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: workstreams/backend

jobs:
  build:
    name: Compile and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B --no-transfer-progress clean compile

      - name: Unit tests
        run: mvn -B --no-transfer-progress test

      - name: Package
        run: mvn -B --no-transfer-progress package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sovereignty-lens-api
          path: workstreams/backend/target/*.jar
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Testcontainers needs a Docker daemon, which ubuntu-latest provides.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Testcontainers integration tests
        run: mvn -B --no-transfer-progress verify

  openapi:
    name: Validate OpenAPI document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint the specification
        run: npx --yes @redocly/cli@latest lint openapi/openapi.yaml

  e2e:
    name: End-to-end API suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start PostgreSQL
        run: |
          docker run -d --name sovereignty-db \
            -e POSTGRES_DB=sovereignty_lens \
            -e POSTGRES_USER=sovereignty \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 \
            --health-cmd "pg_isready -U sovereignty" \
            --health-interval 3s --health-timeout 3s --health-retries 20 \
            postgres:16-alpine
          # Wait for the container to report healthy before the service starts,
          # otherwise Flyway races the database's own initialisation.
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sovereignty-db)
            [ "$status" = "healthy" ] && break
            sleep 2
          done

      - name: Build the service
        run: mvn -B --no-transfer-progress package -DskipTests

      - name: Start the service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sovereignty_lens
          SPRING_DATASOURCE_USERNAME: sovereignty
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          # CI-only fixtures. Real deployments supply these from a secret store.
          APP_ADMIN_PASSWORD: ci-only-presenter-password
          APP_AUTH_SECRET: ci-only-auth-secret-at-least-32-chars
          APP_CONTRIBUTOR_HASH_SECRET: ci-only-hash-secret-at-least-32-chars
          APP_PUBLIC_BASE_URL: http://localhost:3000
          APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          java -jar target/*.jar > service.log 2>&1 &
          echo $! > service.pid
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "service is up"; exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"; cat service.log; exit 1

      - name: Run the end-to-end suite
        env:
          API_BASE_URL: http://localhost:8080
          ADMIN_PASSWORD: ci-only-presenter-password
        working-directory: workstreams/backend/e2e
        run: |
          npm install
          npx playwright test

      - name: Service log on failure
        if: failure()
        run: cat service.log || true

      - name: Stop the service
        if: always()
        run: |
          kill "$(cat service.pid)" 2>/dev/null || true
          docker rm -f sovereignty-db 2>/dev/null || true
